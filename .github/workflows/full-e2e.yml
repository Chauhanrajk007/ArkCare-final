name: ArkCare Full E2E

on:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
      - "Backend/**"
      - "scripts/full-e2e.sh"
      - ".github/workflows/full-e2e.yml"
  workflow_dispatch:

concurrency:
  group: arkcare-full-e2e
  cancel-in-progress: true

jobs:
  full-stack:
    runs-on: [self-hosted]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.22"
      - name: Install app dependencies
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:13000
          AI_CHAT: http://127.0.0.1:18000/chat
          AI_PDF: http://127.0.0.1:18000/parse_report
          NEXT_PUBLIC_CAREQUEST_TEST_BOOKING_BYPASS: "true"
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv-e2e
          uv pip install --python .venv-e2e/bin/python -r Backend/requirements.txt
          cd Frontend
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          npm run build
      - name: Run full stack suite
        env:
          PYTHON_BIN: .venv-e2e/bin/python
          E2E_BACKEND_PORT: "18000"
          E2E_FRONTEND_PORT: "13000"
          E2E_BASE_URL: http://localhost:13000
          NEXT_PUBLIC_APP_URL: http://localhost:13000
          AI_CHAT: http://127.0.0.1:18000/chat
          AI_PDF: http://127.0.0.1:18000/parse_report
          NEXT_PUBLIC_CAREQUEST_TEST_BOOKING_BYPASS: "true"
          CAREQUEST_TEST_BOOKING_BYPASS: "true"
        run: bash scripts/full-e2e.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkcare-full-e2e-results
          if-no-files-found: ignore
          path: |
            Frontend/tests/full-e2e-results.json
            backend-health.json
            backend-health-after-ai.json
            backend-ai.json
            backend-urgent-ai.json
            backend-pdf.json
            backend-e2e.log
            frontend-e2e.log
